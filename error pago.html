<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Fallido | Hotel Quinta Dalam</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" type="image/svg+xml" href="./img/logo/logo-quinta-dalam-dark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        .pago-resultado-page {
            min-height: 80vh; display: flex;
            align-items: center; justify-content: center; padding: 40px 20px;
        }
        .pago-resultado-card {
            background: #fff; border-radius: 24px; padding: 60px 50px;
            text-align: center; max-width: 520px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes cardIn { from { opacity:0; transform:scale(0.88) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .pago-icono-wrap {
            width: 90px; height: 90px; border-radius: 50%;
            background: linear-gradient(135deg, #fde8e8, #f5c6cb);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 28px; font-size: 2.8rem;
            box-shadow: 0 8px 24px rgba(231,76,60,0.15);
        }
        .pago-titulo { font-family:'Playfair Display',Georgia,serif; font-size:2rem; font-weight:700; color:#2d1a0e; margin-bottom:14px; }
        .pago-subtitulo { font-family:'Lato',sans-serif; font-size:1rem; color:#666; line-height:1.7; margin-bottom:28px; }
        .pago-acciones { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
        .btn-pago-primario {
            background: linear-gradient(135deg,#8c5a35,#6b3a1f); color:#fff;
            text-decoration:none; border:none; border-radius:10px; padding:13px 28px;
            font-family:'Lato',sans-serif; font-weight:700; font-size:0.92rem;
            cursor:pointer; box-shadow:0 4px 14px rgba(140,90,53,0.3); transition:all 0.25s ease;
        }
        .btn-pago-primario:hover { transform:translateY(-2px); }
        .btn-pago-secundario {
            background:none; color:#8c5a35; border:1.5px solid #8c5a35;
            border-radius:10px; padding:13px 28px; font-family:'Lato',sans-serif;
            font-weight:700; font-size:0.92rem; cursor:pointer;
            text-decoration:none; transition:all 0.25s ease;
        }
        .btn-pago-secundario:hover { background:rgba(140,90,53,0.06); }
        @media(max-width:500px){ .pago-resultado-card{padding:44px 28px;} .pago-titulo{font-size:1.6rem;} .pago-acciones{flex-direction:column;} }
    </style>
</head>
<body>
    <header>
        <nav class="nav-minimal">
            <a href="index.html" class="Logo">
                <div class="Logo-icon"><img src="./img/logo/logo-quinta-dalam-dark.svg" alt="Logo"></div>
                <div class="Logo-text"><strong>Hotel Quinta Dalam</strong><span>Michoacán · México</span></div>
            </a>
        </nav>
    </header>
    <main>
        <div class="pago-resultado-page">
            <div class="pago-resultado-card">
                <div class="pago-icono-wrap">❌</div>
                <h1 class="pago-titulo">Pago no procesado</h1>
                <p class="pago-subtitulo">
                    Tu pago no pudo completarse. Esto puede deberse a fondos insuficientes,
                    datos incorrectos o un rechazo de tu banco.<br><br>
                    <strong>Tu reservación sigue activa</strong> — puedes intentar de nuevo
                    con otro método de pago.
                </p>
                <div class="pago-acciones">
                    <a href="reservaciones.html" class="btn-pago-primario">🔄 Intentar de nuevo</a>
                    <a href="index.html" class="btn-pago-secundario">🏠 Ir al Inicio</a>
                </div>
            </div>
        </div>
    </main>
    <script src="./js/session.js"></script>
</body>
</html>
