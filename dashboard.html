<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | Hotel Quinta Dalam</title>
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="icon" type="image/svg+xml" href="./img/logo/logo-quinta-dalam-dark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body>

    <!-- Protección de ruta: redirige si no hay sesión de admin -->
    <script>
        (function () {
            try {
                const s = JSON.parse(sessionStorage.getItem('qdSession') || 'null');
                if (!s || s.rol !== 'admin') {
                    window.location.href = 'login.html';
                }
            } catch (e) {
                window.location.href = 'login.html';
            }
        })();
    </script>

    <div id="root-dashboard"></div>

    <script type="text/babel" src="./js/dashboard.js"></script>
</body>
</html>
